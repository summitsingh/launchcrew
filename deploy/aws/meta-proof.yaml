AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LaunchCrew bounded live Spark proof, one-off Fargate task, review only, NOT applied.
  No apply, no ALB, no service, no restart, no photo transfer, no secrets in this file.
  Region, image digest, secrets, network, and cluster are parameters with no approved defaults.
  One task only via RunTask with a distinct meta-proof token. Public API stays keyless.
  Teardown required after Nov 4 and no later than Nov 9, 2026.
Parameters:
  ApiImageUri:
    Type: String
    Description: ECR URI for the API image with exact digest pin, built from containers/api.Containerfile. Must match the deployed API image digest. No default, no latest fallback.
  RuntimeDbUrlSecretArn:
    Type: String
    Description: Secrets Manager ARN for the runtime database connection string, JSON key database-url, placeholder only, no value in this file. The proof task reads only this plus the Meta secret, never master, migration, or TLS.
  MetaSecretArn:
    Type: String
    Description: Secrets Manager ARN for the dedicated LaunchCrew product Meta key, JSON key meta-api-key, placeholder only, no value in this file. Created outside this stack by the reviewed loader; the proof task reads only this plus runtime DB.
  ClusterName:
    Type: String
    Description: Owned ECS cluster name for the one-off RunTask. No default.
  SubnetA:
    Type: String
    Description: Owned public subnet id for Fargate awsvpc with AssignPublicIp ENABLED. No default.
  SubnetB:
    Type: String
    Description: Second owned public subnet id for Fargate awsvpc. No default.
  JobSecurityGroupId:
    Type: String
    Description: Owned JobSG id with no inbound, egress to DB plus 443 only. No default.
Resources:
  MetaProofLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /launchcrew/demo/meta-proof
      RetentionInDays: 7
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  MetaProofExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: metaproof-execution-secrets-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref RuntimeDbUrlSecretArn, !Ref MetaSecretArn]
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  MetaProofTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  MetaProofTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt MetaProofExecutionRole.Arn
      TaskRoleArn: !GetAtt MetaProofTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
        - { Key: TeardownBy, Value: '2026-11-09' }
      ContainerDefinitions:
        - Name: meta-proof
          Image: !Ref ApiImageUri
          Essential: true
          Command: [/opt/venv/bin/python, -m, backend.live_meta_proof, --live, --mode, spark]
          Environment:
            - { Name: LAUNCHCREW_DB_TLS_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOTCERT, Value: /app/rds-ca-bundle.pem }
            - { Name: AUTH_ENABLED, Value: 'false' }
            - { Name: META_MODEL, Value: muse-spark-1.3 }
            - { Name: META_API_BASE_URL, Value: https://api.meta.ai/v1 }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Sub '${RuntimeDbUrlSecretArn}:database-url::' }
            - { Name: META_API_KEY, ValueFrom: !Sub '${MetaSecretArn}:meta-api-key::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MetaProofLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: meta-proof
Outputs:
  TaskDefinitionArn:
    Description: Owned one-off proof task definition ARN.
    Value: !Ref MetaProofTaskDefinition
  ExecutionRoleArn:
    Description: Owned narrow proof execution role ARN.
    Value: !GetAtt MetaProofExecutionRole.Arn
  TaskRoleArn:
    Description: Owned empty proof task role ARN.
    Value: !GetAtt MetaProofTaskRole.Arn
