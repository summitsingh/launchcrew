AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  LaunchCrew demo, Fargate plus ALB, review only, NOT applied.
  No apply, no DNS, no secrets in this file.
  Region, cert ARN, images, secrets are parameters with no approved defaults.
  No budget or SNS here: launchcrew-demo budget plus topic live only in
  foundation.yaml, verified read-only before paid phases. Region us-east-1
  NOT confirmed, see deploy README. Cost cap is a user choice, not a default.
  Teardown required after Nov 4 and no later than Nov 9, 2026.
  Fresh VPC 10.42.0.0/16 avoids 10.0.0.0/16, no existing network changes.
  Filter with no data or 0 is not proof of zero spend and not a hard cap.
  Tag activation see deploy README. Two SDK jobs share bootstrap image
  with explicit EntryPoint; default stays binder --bind.
Parameters:
  AcmCertificateArn:
    Type: String
    Description: ACM public certificate ARN for the ALB HTTPS listener. No default, no certificate value in this file.
  ApiImageUri:
    Type: String
    Description: ECR URI for the API image, built from containers/api.Containerfile, with no migration at runtime startup.
  WebImageUri:
    Type: String
    Description: ECR URI for the web image. The web app container binds 127.0.0.1:3000 only in TLS mode, and is never exposed directly to the ALB.
  WebProxyImageUri:
    Type: String
    Description: ECR URI for the web TLS proxy sidecar image, built from containers/web-proxy.Containerfile. The ALB web target group points at this proxy, port 8443, not at the app.
  MigrationImageUri:
    Type: String
    Description: ECR URI for the migration image, built from containers/migrate.Containerfile, used only by the one-off migration task.
  RuntimeDbUrlSecretArn:
    Type: String
    Description: Secrets Manager ARN for the runtime database connection string, JSON key database-url, placeholder only, no value in this file. The runtime task reads only this secret, never the migration secret. The connection string value must include sslmode=verify-full, otherwise backend/store.py with LAUNCHCREW_DB_TLS_MODE=verify-full fails closed.
  MigrationDbUrlSecretArn:
    Type: String
    Description: Secrets Manager ARN for the migration database connection string, JSON key database-url, placeholder only, no value in this file. The migration task reads only this secret, never the runtime secret. The connection string value must include sslmode=verify-full, otherwise backend/store.py fails closed. Migration uses a separate database identity, see deploy/aws/db-roles.sql, not just a separate IAM role.
  TlsSecretArn:
    Type: String
    Description: Secrets Manager ARN for TLS certificate material, JSON keys tls-cert-b64 and tls-key-b64, base64 PEM, placeholder only, no value in this file. API and web proxy entrypoints decode these values to files at task start, without logging, and the decoded files live only in the task container.
  MasterDbPasswordSecretArn:
    Type: String
    Description: Secrets Manager ARN for the master database password, JSON key password, placeholder only, no value in this file. Used only for initial RDS creation. Runtime and migration tasks never read this secret, they use only their own database URL secrets.
  DatabaseUsername:
    Type: String
    Default: launchcrew_master
    Description: Master database username, for initial creation only. Runtime and migration identities are created separately by deploy/aws/db-roles.sql and are never the master identity.
  EnableServices:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Staged bootstrap gate. Default false keeps both ECS services at DesiredCount 0 so infrastructure, ECR repositories, RDS, and task definitions exist first with no app running. Set to true only after images are verified, prereq materials are populated and verified, database roles are bound, and the migration one-off task has STOPPED with exit code 0 plus schema proof, via deploy/aws/bootstrap.sh. Never set true with placeholder image URIs.
  BootstrapImageUri:
    Type: String
    Description: ECR URI for the bootstrap database-role image, built from containers/bootstrap-db.Containerfile, used only by the isolated one-off bootstrap task. No default, no placeholder at apply time.
  EnableGoogleAuth:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Google-only auth gate. Default false keeps the API keyless with AUTH_ENABLED false and no Google secret. Set to true plus GoogleOAuthSecretArn only for explicit Google sign-in wiring. Source-only until live provider proof. No Meta credential and no Facebook injection in Google-only mode.
  GoogleOAuthSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for the Google OAuth client, JSON keys google-client-id and google-client-secret, placeholder only, no value in this file. Used only when EnableGoogleAuth is true. The API task receives GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET only then, via ECS task secrets. Empty default means no secret and auth stays disabled.
  MetaSecretArn:
    Type: String
    Default: ''
    Description: Secrets Manager ARN for the dedicated LaunchCrew product Meta key, JSON key meta-api-key, placeholder only, no value in this file. Created outside this stack by the reviewed loader. The API task receives META_API_KEY only when this ARN is set, via ECS task secrets. Empty default keeps the runtime keyless with deterministic fallback.
Rules:
  GoogleAuthRequiresSecret:
    RuleCondition: !Equals ['true', !Ref EnableGoogleAuth]
    Assertions:
      - Assert: !Not [!Equals ['', !Ref GoogleOAuthSecretArn]]
        AssertDescription: EnableGoogleAuth true requires exact GoogleOAuthSecretArn, empty refused before any mutation.
Conditions:
  ServicesEnabled: !Equals ['true', !Ref EnableServices]
  GoogleAuthEnabled: !And [!Equals ['true', !Ref EnableGoogleAuth], !Not [!Equals ['', !Ref GoogleOAuthSecretArn]]]
  MetaKeyEnabled: !Not [!Equals ['', !Ref MetaSecretArn]]
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      # Fresh demo range. Existing nondefault network uses 10.0.0.0/16,
      # so this template uses 10.42.0.0/16 with no overlap, no peering,
      # and no changes to any existing network, route, or attachment.
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
        - { Key: TeardownBy, Value: '2026-11-09' }
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB ingress only, HTTPS from internet, HTTP redirect only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API tasks, inbound only from ALB, TLS port 8443 only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web tasks, inbound only from ALB, TLS port 8443 only, web TLS proxy sidecar
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8443
          ToPort: 8443
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS, inbound only from API tasks and isolated one-off job tasks, Postgres port only, no public port
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroup
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  JobSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: One-off bootstrap, migration, and verify tasks only, no inbound at all, public egress only for ECR Secrets Logs plus Postgres to RDS
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  DbJobIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref JobSecurityGroup
  JobDbEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref JobSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DbSecurityGroup
  ApiEcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: launchcrew-api
      EmptyOnDelete: true
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  WebEcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: launchcrew-web
      EmptyOnDelete: true
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  WebProxyEcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: launchcrew-web-proxy
      EmptyOnDelete: true
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  MigrationEcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: launchcrew-migration
      EmptyOnDelete: true
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  BootstrapEcrRepo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: launchcrew-bootstrap
      EmptyOnDelete: true
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /launchcrew/demo/api
      RetentionInDays: 7
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /launchcrew/demo/web
      RetentionInDays: 7
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: /launchcrew/demo/migration
      RetentionInDays: 7
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: LaunchCrew demo RDS, private subnets only
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceClass: db.t4g.micro
      Engine: postgres
      AllocatedStorage: '20'
      StorageType: gp3
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: true
      DeletionProtection: false
      PubliclyAccessible: false
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      MasterUsername: !Ref DatabaseUsername
      # Initial creation only. After creation, run deploy/aws/db-roles.sql with the master user to create separated runtime and migration identities, then runtime and migration tasks use their own secrets, never this master secret.
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${MasterDbPasswordSecretArn}:SecretString:password}}'
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
        - { Key: TeardownBy, Value: '2026-11-09' }
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: launchcrew-demo
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: api-execution-secrets-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref RuntimeDbUrlSecretArn, !Ref TlsSecretArn]
  WebExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: web-execution-secrets-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref TlsSecretArn]
  MigrationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: migration-execution-secrets-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref MigrationDbUrlSecretArn]
  BootstrapExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: bootstrap-execution-secrets-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource:
                  - !Ref MasterDbPasswordSecretArn
                  - !Ref RuntimeDbUrlSecretArn
                  - !Ref MigrationDbUrlSecretArn
  VerifyExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: verify-execution-secrets-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref RuntimeDbUrlSecretArn]
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: []
  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: []
  MigrationTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: []
  BootstrapTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: []
  VerifyTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: []
  SdkInitExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies: []
  SdkInitTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sdk-init-prereq-populate-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:DescribeSecret]
                Resource:
                  - !Ref MasterDbPasswordSecretArn
                  - !Ref RuntimeDbUrlSecretArn
                  - !Ref MigrationDbUrlSecretArn
                  - !Ref TlsSecretArn
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue, secretsmanager:PutSecretValue]
                Resource:
                  - !Ref RuntimeDbUrlSecretArn
                  - !Ref MigrationDbUrlSecretArn
                  - !Ref TlsSecretArn
              - Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                  - acm:GetCertificate
                  - acm:ExportCertificate
                Resource: [!Ref AcmCertificateArn]
  SdkMaterialExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies: []
  SdkMaterialTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sdk-material-verify-readonly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:DescribeSecret, secretsmanager:GetSecretValue]
                Resource:
                  - !Ref RuntimeDbUrlSecretArn
                  - !Ref MigrationDbUrlSecretArn
                  - !Ref TlsSecretArn
              - Effect: Allow
                Action:
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                  - acm:GetCertificate
                Resource: [!Ref AcmCertificateArn]
  ApiGoogleAuthPolicy:
    Type: AWS::IAM::Policy
    Condition: GoogleAuthEnabled
    Properties:
      PolicyName: api-google-auth-secret-only
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: [!Ref GoogleOAuthSecretArn]
      Roles: [!Ref ApiExecutionRole]
  ApiMetaSecretPolicy:
    Type: AWS::IAM::Policy
    Condition: MetaKeyEnabled
    Properties:
      PolicyName: api-meta-secret-only
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: [!Ref MetaSecretArn]
      Roles: [!Ref ApiExecutionRole]
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ApiExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8443, Protocol: tcp }]
          Environment:
            - { Name: LAUNCHCREW_REQUIRE_CONTAINER_TLS, Value: '1' }
            - { Name: LAUNCHCREW_DB_TLS_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOTCERT, Value: /app/rds-ca-bundle.pem }
            - { Name: PUBLIC_BASE_URL, Value: 'https://launchcrew.summitsingh.com' }
            - { Name: AUTH_ENABLED, Value: !If [GoogleAuthEnabled, 'true', 'false'] }
            - { Name: META_MODEL, Value: muse-spark-1.3 }
            - { Name: META_API_BASE_URL, Value: https://api.meta.ai/v1 }
          Secrets: !If
            - GoogleAuthEnabled
            - !If
              - MetaKeyEnabled
              - - { Name: DATABASE_URL, ValueFrom: !Sub '${RuntimeDbUrlSecretArn}:database-url::' }
                - { Name: TLS_CERT_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-cert-b64::' }
                - { Name: TLS_KEY_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-key-b64::' }
                - { Name: GOOGLE_CLIENT_ID, ValueFrom: !Sub '${GoogleOAuthSecretArn}:google-client-id::' }
                - { Name: GOOGLE_CLIENT_SECRET, ValueFrom: !Sub '${GoogleOAuthSecretArn}:google-client-secret::' }
                - { Name: META_API_KEY, ValueFrom: !Sub '${MetaSecretArn}:meta-api-key::' }
              - - { Name: DATABASE_URL, ValueFrom: !Sub '${RuntimeDbUrlSecretArn}:database-url::' }
                - { Name: TLS_CERT_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-cert-b64::' }
                - { Name: TLS_KEY_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-key-b64::' }
                - { Name: GOOGLE_CLIENT_ID, ValueFrom: !Sub '${GoogleOAuthSecretArn}:google-client-id::' }
                - { Name: GOOGLE_CLIENT_SECRET, ValueFrom: !Sub '${GoogleOAuthSecretArn}:google-client-secret::' }
            - !If
              - MetaKeyEnabled
              - - { Name: DATABASE_URL, ValueFrom: !Sub '${RuntimeDbUrlSecretArn}:database-url::' }
                - { Name: TLS_CERT_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-cert-b64::' }
                - { Name: TLS_KEY_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-key-b64::' }
                - { Name: META_API_KEY, ValueFrom: !Sub '${MetaSecretArn}:meta-api-key::' }
              - - { Name: DATABASE_URL, ValueFrom: !Sub '${RuntimeDbUrlSecretArn}:database-url::' }
                - { Name: TLS_CERT_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-cert-b64::' }
                - { Name: TLS_KEY_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-key-b64::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt WebExecutionRole.Arn
      TaskRoleArn: !GetAtt WebTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      ContainerDefinitions:
        - Name: web-app
          Image: !Ref WebImageUri
          Essential: true
          Command: [node, server.js]
          Environment:
            - { Name: HOSTNAME, Value: 127.0.0.1 }
            - { Name: PORT, Value: '3000' }
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web-app
        - Name: web-proxy
          Image: !Ref WebProxyImageUri
          Essential: true
          PortMappings: [{ ContainerPort: 8443, Protocol: tcp }]
          Environment:
            - { Name: TLS_PROXY_TARGET, Value: 'http://127.0.0.1:3000' }
            - { Name: TLS_PROXY_PORT, Value: '8443' }
          Secrets:
            - { Name: TLS_CERT_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-cert-b64::' }
            - { Name: TLS_KEY_B64, ValueFrom: !Sub '${TlsSecretArn}:tls-key-b64::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web-proxy
  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt MigrationExecutionRole.Arn
      TaskRoleArn: !GetAtt MigrationTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      ContainerDefinitions:
        - Name: migration
          Image: !Ref MigrationImageUri
          Essential: true
          Environment:
            - { Name: LAUNCHCREW_DB_TLS_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOTCERT, Value: /app/rds-ca-bundle.pem }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Sub '${MigrationDbUrlSecretArn}:database-url::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: migration
  BootstrapTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt BootstrapExecutionRole.Arn
      TaskRoleArn: !GetAtt BootstrapTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      ContainerDefinitions:
        - Name: bootstrap-db-roles
          Image: !Ref BootstrapImageUri
          Essential: true
          Environment:
            - { Name: LAUNCHCREW_DB_TLS_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOTCERT, Value: /app/rds-ca-bundle.pem }
            - { Name: DB_NAME, Value: launchcrew }
            - { Name: DB_MASTER_USER, Value: !Ref DatabaseUsername }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: APP_SCHEMA, Value: public }
            - { Name: RUNTIME_USER, Value: launchcrew_runtime }
            - { Name: MIGRATION_USER, Value: launchcrew_migration }
          Secrets:
            - { Name: MASTER_DB_PASSWORD, ValueFrom: !Sub '${MasterDbPasswordSecretArn}:password::' }
            - { Name: RUNTIME_DB_URL, ValueFrom: !Sub '${RuntimeDbUrlSecretArn}:database-url::' }
            - { Name: MIGRATION_DB_URL, ValueFrom: !Sub '${MigrationDbUrlSecretArn}:database-url::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: bootstrap-db-roles
  VerifyTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt VerifyExecutionRole.Arn
      TaskRoleArn: !GetAtt VerifyTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      ContainerDefinitions:
        - Name: bootstrap-db-roles
          Image: !Ref BootstrapImageUri
          Essential: true
          Command: ['--verify']
          Environment:
            - { Name: LAUNCHCREW_DB_TLS_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOTCERT, Value: /app/rds-ca-bundle.pem }
            - { Name: DB_NAME, Value: launchcrew }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: RUNTIME_USER, Value: launchcrew_runtime }
            - { Name: MIGRATION_USER, Value: launchcrew_migration }
          Secrets:
            - { Name: RUNTIME_DB_URL, ValueFrom: !Sub '${RuntimeDbUrlSecretArn}:database-url::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: verify-db-roles
  SdkInitTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt SdkInitExecutionRole.Arn
      TaskRoleArn: !GetAtt SdkInitTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      ContainerDefinitions:
        - Name: sdk-init
          Image: !Ref BootstrapImageUri
          Essential: true
          EntryPoint: [/opt/venv/bin/python, /app/scripts/populate_prereqs.py]
          Command: ['--populate']
          Environment:
            - { Name: LAUNCHCREW_EXPECTED_ACCOUNT, Value: !Ref AWS::AccountId }
            - { Name: LAUNCHCREW_EXPECTED_REGION, Value: !Ref AWS::Region }
            - { Name: LAUNCHCREW_EXPECTED_ROLE, Value: !Ref SdkInitTaskRole }
            - { Name: LAUNCHCREW_MASTER_SECRET_ARN, Value: !Ref MasterDbPasswordSecretArn }
            - { Name: LAUNCHCREW_RUNTIME_SECRET_ARN, Value: !Ref RuntimeDbUrlSecretArn }
            - { Name: LAUNCHCREW_MIGRATION_SECRET_ARN, Value: !Ref MigrationDbUrlSecretArn }
            - { Name: LAUNCHCREW_TLS_SECRET_ARN, Value: !Ref TlsSecretArn }
            - { Name: LAUNCHCREW_CERT_ARN, Value: !Ref AcmCertificateArn }
            - { Name: LAUNCHCREW_DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: LAUNCHCREW_DB_TLS_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOTCERT, Value: /app/rds-ca-bundle.pem }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: sdk-init
  SdkMaterialTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt SdkMaterialExecutionRole.Arn
      TaskRoleArn: !GetAtt SdkMaterialTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      ContainerDefinitions:
        - Name: sdk-material
          Image: !Ref BootstrapImageUri
          Essential: true
          EntryPoint: [/opt/venv/bin/python, /app/scripts/populate_prereqs.py]
          Command: ['--verify-material']
          Environment:
            - { Name: LAUNCHCREW_EXPECTED_ACCOUNT, Value: !Ref AWS::AccountId }
            - { Name: LAUNCHCREW_EXPECTED_REGION, Value: !Ref AWS::Region }
            - { Name: LAUNCHCREW_EXPECTED_ROLE, Value: !Ref SdkMaterialTaskRole }
            - { Name: LAUNCHCREW_MASTER_SECRET_ARN, Value: !Ref MasterDbPasswordSecretArn }
            - { Name: LAUNCHCREW_RUNTIME_SECRET_ARN, Value: !Ref RuntimeDbUrlSecretArn }
            - { Name: LAUNCHCREW_MIGRATION_SECRET_ARN, Value: !Ref MigrationDbUrlSecretArn }
            - { Name: LAUNCHCREW_TLS_SECRET_ARN, Value: !Ref TlsSecretArn }
            - { Name: LAUNCHCREW_CERT_ARN, Value: !Ref AcmCertificateArn }
            - { Name: LAUNCHCREW_DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: LAUNCHCREW_DB_TLS_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOTCERT, Value: /app/rds-ca-bundle.pem }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: sdk-material
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8443
      Protocol: HTTPS
      TargetType: ip
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTPS
      Matcher: { HttpCode: '200' }
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Port: 8443
      Protocol: HTTPS
      TargetType: ip
      HealthCheckPath: /
      HealthCheckProtocol: HTTPS
      Matcher: { HttpCode: '200' }
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates: [{ CertificateArn: !Ref AcmCertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          Values: [/api/*]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup
  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiListenerRule
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !If [ServicesEnabled, 1, 0]
      LaunchType: FARGATE
      PropagateTags: SERVICE
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref ApiSecurityGroup]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8443
          TargetGroupArn: !Ref ApiTargetGroup
  WebService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !If [ServicesEnabled, 1, 0]
      LaunchType: FARGATE
      PropagateTags: SERVICE
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref WebSecurityGroup]
      LoadBalancers:
        - ContainerName: web-proxy
          ContainerPort: 8443
          TargetGroupArn: !Ref WebTargetGroup
  RoleStateExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: rolestate-execution-secrets-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref RuntimeDbUrlSecretArn, !Ref MigrationDbUrlSecretArn]
  RoleStateTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies: []
  RoleStateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt RoleStateExecutionRole.Arn
      TaskRoleArn: !GetAtt RoleStateTaskRole.Arn
      Tags:
        - { Key: Project, Value: LaunchCrew }
        - { Key: Environment, Value: demo }
      ContainerDefinitions:
        - Name: bootstrap-db-roles
          Image: !Ref BootstrapImageUri
          Essential: true
          Command: ['--verify-role-state']
          Environment:
            - { Name: LAUNCHCREW_DB_TLS_MODE, Value: verify-full }
            - { Name: DATABASE_SSL_ROOTCERT, Value: /app/rds-ca-bundle.pem }
            - { Name: DB_NAME, Value: launchcrew }
            - { Name: DB_MASTER_USER, Value: !Ref DatabaseUsername }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: APP_SCHEMA, Value: public }
            - { Name: RUNTIME_USER, Value: launchcrew_runtime }
            - { Name: MIGRATION_USER, Value: launchcrew_migration }
          Secrets:
            - { Name: RUNTIME_DB_URL, ValueFrom: !Sub '${RuntimeDbUrlSecretArn}:database-url::' }
            - { Name: MIGRATION_DB_URL, ValueFrom: !Sub '${MigrationDbUrlSecretArn}:database-url::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MigrationLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: role-state
Outputs:
  LoadBalancerDnsName:
    Description: ALB DNS name, placeholder target only, Cloudflare record requires separate explicit authorization
    Value: !GetAtt LoadBalancer.DNSName
  ApiServiceName:
    Value: !Ref ApiService
  WebServiceName:
    Value: !Ref WebService
