[project]
name = "launchcrew"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.4",
  "starlette==1.3.1",
  "uvicorn==0.34.0",
  "psycopg[binary]==3.2.13",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "authlib==1.9.1",
  "httpx==0.28.1",
  "pillow==13.0.0",
]
[dependency-groups]
dev = ["pytest==9.2.0"]
[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests/test_photo_gates.py"]
pythonpath = ["."]
